# Read by sonar-scanner in the Jenkins 'SonarQube Analysis' stage.
# The server URL and token are injected by Jenkins (withSonarQubeEnv), never stored here.
sonar.projectKey=event-master-web
sonar.projectName=Event Master Web
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/.next/**,public/**
sonar.sourceEncoding=UTF-8
